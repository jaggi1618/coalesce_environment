operation:
  config:
    insertStrategy: INSERT
    postSQL: |-
      BEGIN
      USE DATABASE DB_SHIFT_POC;

      UPDATE DB_SHIFT_POC.SAMPLED_SOURCE.DW_CLIENT_BENCHMARKING_CLIENT AS CBC
      SET 
          DW_DATE_DELETED = CURRENT_TIMESTAMP(),
          DW_DATE_UPDATED = CURRENT_TIMESTAMP(),
          DW_UPDATE_USER = 'dbo.spdw_dw_client_benchmarking_client_insertUpdate'
      WHERE 
          CBC.DW_DATE_DELETED IS NULL
          AND NOT EXISTS (
              SELECT 1
              FROM {{ ref('DBSHIFT', 'DW_CLIENT_BENCHMARKING_CLIENT_STAGING') }} AS STG
              WHERE STG.SOURCE_SYSTEM_CLIENT_ID = CBC.SOURCE_SYSTEM_CLIENT_ID
                AND STG.SOURCE_SYSTEM_POLICY_LINE_ID = CBC.SOURCE_SYSTEM_POLICY_LINE_ID
          );
      END
